name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: app
      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: app
      - name: Unit tests
        run: npx vitest run
        working-directory: app
      - name: Production build
        run: npm run build
        working-directory: app
